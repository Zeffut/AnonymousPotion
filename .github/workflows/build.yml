name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Paper ${{ matrix.paper }} / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - paper: '1.21.11'
            java: '21'
          - paper: '26.1.2'
            java: '25'
          - paper: '26.2'
            java: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests against Paper API target
        run: ./gradlew --no-daemon clean test build -PpaperTarget=${{ matrix.paper }} -PjavaVersion=${{ matrix.java }}
