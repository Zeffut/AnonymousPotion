# AnonymousPotion — brouille le pseudo des joueurs invisibles dans les messages de mort.

# Nombre de caractères du texte brouillé. Identique pour tous les joueurs : une longueur
# variable trahirait l'identité du tueur sur un serveur peu peuplé. Entre 1 et 32.
obfuscated-length: 8

# Caractère de base du brouillage. Minecraft remplace chaque caractère par un glyphe
# aléatoire de MÊME LARGEUR, donc ce choix fixe la largeur affichée à l'écran.
# 'a' correspond à la largeur d'une lettre standard.
filler-character: 'a'

# Brouiller aussi le nom des armes personnalisées, qui peuvent trahir le tueur.
# Ne s'applique qu'aux messages où un joueur invisible est déjà brouillé.
obfuscate-weapon-name: true

# Écrire dans les logs serveur le pseudo réel des joueurs brouillés, pour la modération.
log-real-names: true

# Télémétrie PostHog pseudonymisée — passer à false puis redémarrer complètement le serveur.
# Les événements sont identifiés par un UUID d'installation persistant ; ce n'est pas un
# anonymat absolu. Aucun pseudo, UUID de joueur ni contenu de message n'est placé dans les
# événements. $ip: null demande à PostHog de ne pas associer l'IP source au profil, mais ne
# masque pas l'IP source au service qui reçoit la connexion HTTP.
# Le fichier .install-id peut tout de même être lu ou créé lorsque la télémétrie est désactivée.
# /anonymouspotion reload ne reconfigure pas le client : un redémarrage est requis.
# Quatre propriétés accompagnent chaque événement : `app` (le nom court du plugin, toujours
# "anonymouspotion"), `source` (la plateforme, toujours "paper"), `mc_version` (la version de
# Minecraft du serveur) et `component_version` (la version du plugin).
# Liste complète des événements et propriétés envoyés dans le README, section "Télémétrie".
telemetry: true

# Instance PostHog destinataire. À changer pour viser une instance auto-hébergée.
telemetry-host: "https://eu.i.posthog.com"
